name: Generate GitWorld

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"   # runs daily at midnight UTC

permissions:
  contents: write

concurrency:
  group: gitworld
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Ensure output directory exists
        run: mkdir -p dist

      - name: Generate GitWorld SVG
        uses: Dasmat13/git-world-action@main
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          svg_out_path: dist/gitworld.svg

      - name: Commit and push generated SVG
        run: |
          if [ ! -s dist/gitworld.svg ]; then
            echo "::error::dist/gitworld.svg was not generated"
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add dist/gitworld.svg

          if git diff --staged --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -m "Update GitWorld animation"

          for attempt in 1 2 3; do
            if git push origin HEAD:main; then
              echo "Pushed updated SVG on attempt $attempt"
              exit 0
            fi
            sleep 5
            git pull --rebase --autostash origin main
          done

          echo "::error::Could not push the updated GitWorld SVG"
          exit 1
